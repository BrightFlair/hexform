name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  composer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ 8.4, 8.5 ]

    steps:
      - uses: actions/checkout@v6

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}

      - name: Composer install
        uses: php-actions/composer@v6
        with:
          php_version: ${{ matrix.php }}
          php_extensions: pcntl

      - name: Build frontend assets
        run: npm ci && npm run build

      - name: Archive build
        run: mkdir /tmp/github-actions/ && tar --exclude=".git" -cvf /tmp/github-actions/build.tar ./

      - name: Upload build archive for test runners
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-${{ matrix.php }}
          path: /tmp/github-actions
          retention-days: 1

  phpunit:
    runs-on: ubuntu-latest
    needs: [ composer ]
    strategy:
      matrix:
        php: [ 8.4, 8.5 ]

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-artifact-${{ matrix.php }}
          path: /tmp/github-actions

      - name: Extract build archive
        run: tar -xvf /tmp/github-actions/build.tar ./

      - name: PHP Unit tests
        uses: php-actions/phpunit@v4
        env:
          XDEBUG_MODE: cover
        with:
          php_version: ${{ matrix.php }}
          php_extensions: xdebug
          coverage_text: _coverage/coverage.txt
          coverage_clover: _coverage/clover.xml

      - name: Store coverage data
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-${{ matrix.php }}-${{ github.run_number }}
          path: _coverage

  coverage:
    runs-on: ubuntu-latest
    needs: [ phpunit ]
    strategy:
      matrix:
        php: [ 8.4, 8.5 ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: code-coverage-${{ matrix.php }}-${{ github.run_number }}
          path: _coverage

      - name: Output coverage
        run: cat "_coverage/coverage.txt"

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}

  phpstan:
    runs-on: ubuntu-latest
    needs: [ composer ]
    strategy:
      matrix:
        php: [ 8.4, 8.5 ]

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-artifact-${{ matrix.php }}
          path: /tmp/github-actions

      - name: Extract build archive
        run: tar -xvf /tmp/github-actions/build.tar ./

      - name: PHP Static Analysis
        uses: php-actions/phpstan@v3
        with:
          php_version: ${{ matrix.php }}
          path: class/
          level: 6
          memory_limit: 256M

  phpmd:
    runs-on: ubuntu-latest
    needs: [ composer ]
    strategy:
      matrix:
        php: [ 8.4, 8.5 ]

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-artifact-${{ matrix.php }}
          path: /tmp/github-actions

      - name: Extract build archive
        run: tar -xvf /tmp/github-actions/build.tar ./

      - name: PHP Mess Detector
        uses: php-actions/phpmd@v1
        with:
          php_version: ${{ matrix.php }}
          path: class/
          output: text
          ruleset: phpmd.xml

  phpcs:
    runs-on: ubuntu-latest
    needs: [ composer ]
    strategy:
      matrix:
        php: [ 8.4, 8.5 ]

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-artifact-${{ matrix.php }}
          path: /tmp/github-actions

      - name: Extract build archive
        run: tar -xvf /tmp/github-actions/build.tar ./

      - name: PHP Code Sniffer
        uses: php-actions/phpcs@v1
        with:
          php_version: ${{ matrix.php }}
          vendored_phpcs_path: vendor/bin/phpcs
          path: class/
          standard: phpcs.xml

  behat:
    runs-on: ubuntu-latest
    needs: [composer]
    strategy:
      matrix:
        php: [ 8.4, 8.5 ]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: hexform
          MYSQL_USER: hexform_user
          MYSQL_PASSWORD: hexform_pass
          MYSQL_ROOT_PASSWORD: root_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root_pass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-artifact-${{ matrix.php }}
          path: /tmp/github-actions

      - name: Extract build archive
        run: tar -xvf /tmp/github-actions/build.tar ./

      - name: Run Behat
        uses: php-actions/behat@chrome
        with:
          php_version: ${{ matrix.php }}
          php_extensions: pdo_mysql mbstring
          vendored_behat_path: vendor/bin/behat
          base_url: http://localhost:8000
          app_command: >-
            php vendor/bin/migrate
            --host 127.0.0.1
            --port 3306
            --database hexform
            --username hexform_user
            --password hexform_pass
            && (php -S 127.0.0.1:8001 test/behat/stripe-router.php
            >/tmp/hexform-behat-stripe.log 2>&1 &)
            && exec env HEXFORM_BEHAT=1
            HEXFORM_STRIPE_API_BASE=http://127.0.0.1:8001
            php -d display_errors=0 -S 0.0.0.0:8000
            -t /app/www /app/vendor/phpgt/webengine/go.php
