<header class="app-page-heading">
	<div>
		<p>New endpoint</p>
		<h1>Create an endpoint</h1>
		<p>You can fine-tune junk protection, retention, and forwarding after creation.</p>
	</div>
</header>

<form class="settings-form" method="post">
	<div class="field-row">
		<label>
			<span>Title</span>
			<input name="title" required autocomplete="off" placeholder="Contact form" />
		</label>
		<label>
			<span>Client host</span>
			<input type="url" name="clientHost" required placeholder="https://example.com" />
		</label>
	</div>

	<div class="actions">
		<a class="quiet" href="/app/endpoints/">Cancel</a>
		<button name="do" value="create">Create endpoint</button>
	</div>
</form>
