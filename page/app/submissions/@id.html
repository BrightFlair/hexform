<header class="app-page-heading">
	<div>
		<p data-bind:text="endpointTitle">Endpoint</p>
		<h1>Submission</h1>
		<p>
			Received
			<span data-bind:text="dateDisplay">recently</span>
			from
			<span data-bind:text="submitter">an unknown submitter</span>
			.
		</p>
	</div>
	<a class="secondary" href="/app/submissions/">Back to inbox</a>
</header>

<section class="submission-detail">
	<h2>Submitted data</h2>
	<dl>
		<div data-list>
			<dt data-bind:text="field">Field</dt>
			<dd data-bind:text="value">Value</dd>
		</div>
	</dl>

	<div class="forwarding-activity">
		<h2>Forwarding activity</h2>
		<p data-no-forwarding-log>No forwarding attempts were made for this submission.</p>
		<ul data-forwarding-log>
			<li data-list>
				<header>
					<strong data-bind:text="typeDisplay">Forwarder</strong>
					<span data-bind:text="outcomeDisplay">Status</span>
				</header>
				<p data-bind:text="destination">Destination</p>
				<p data-bind:text="status">Forwarder response</p>
				<time data-bind:text="dateDisplay">Time</time>
			</li>
		</ul>
	</div>
</section>
